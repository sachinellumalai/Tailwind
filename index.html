<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoBloom</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>

<body class="bg-gray-50">

<!-- Navbar -->
<nav class="bg-white/80 backdrop-blur-md p-4 flex justify-between items-center shadow-md sticky top-0 z-50 border-b">
  <h1 class="text-2xl font-bold text-green-700">EcoBloom</h1>
  <ul class="hidden md:flex gap-8 text-gray-700 font-medium">
    <li><a href="index.html" class="hover:text-green-700">Home</a></li>
    <li><a href="product.html" class="hover:text-green-700">Products</a></li>
    <li><a href="contact.html" class="hover:text-green-700">Contact</a></li>
  </ul>
</nav>

<!-- Hero -->
<section class="bg-gradient-to-r from-green-100 to-green-50 p-6 md:p-16 flex flex-col md:flex-row items-center justify-between">
  <div class="max-w-xl">
    <p class="text-green-700 font-medium mb-3">Bring Nature Home 🌿</p>
    <h2 class="text-4xl md:text-6xl font-bold mb-6">Plants that make your space alive</h2>
    <p class="text-gray-600 mb-6">Discover a wide range of indoor and outdoor plants.</p>
    <div class="flex gap-4">
      <button class="bg-green-700 text-white px-6 py-3 rounded-full">Shop Now</button>
      <button class="border border-green-700 px-6 py-3 rounded-full text-green-700">Explore</button>
    </div>
  </div>

  <img src="./images/klarbaer-plant-pot-with-saucer-in-outdoor-grey-brown__1156489_pe887113_s5.avif"
       class="w-80 md:w-96 mt-8 md:mt-0 rounded-xl shadow-lg">
</section>

<!-- Products -->
<section class="p-6 text-center">
  <h1 class="text-3xl font-bold mb-6">Best Sellers</h1>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-6">

    <div class="bg-white p-4 rounded-xl shadow hover:shadow-xl">
      <img src="./images/Bestseller_1.jpg" class="rounded mb-3">
      <h1>Rose Plant</h1>
      <p class="text-green-700 font-bold">$30</p>
    </div>

    <div class="bg-white p-4 rounded-xl shadow hover:shadow-xl">
      <img src="./images/Bestseller_2.jpg" class="rounded mb-3">
      <h1>Palm Plant</h1>
      <p class="text-green-700 font-bold">$25</p>
    </div>

    <div class="bg-white p-4 rounded-xl shadow hover:shadow-xl">
      <img src="./images/Bestseller_3.jpg" class="rounded mb-3">
      <h1>Lotus Plant</h1>
      <p class="text-green-700 font-bold">$35</p>
    </div>

    <div class="bg-white p-4 rounded-xl shadow hover:shadow-xl">
      <img src="./images/Bestseller_4.jpg" class="rounded mb-3">
      <h1>Big Leaf Plant</h1>
      <p class="text-green-700 font-bold">$15</p>
    </div>

  </div>
</section>

<!-- Footer -->
<section class="bg-gray-900 text-white p-10 text-center">
  <h1 class="text-3xl text-green-400 font-bold">EcoBloom</h1>
  <p class="text-gray-400">Bringing nature closer 🌿</p>
  <p class="text-gray-500 text-sm mt-2">© 2026 EcoBloom</p>
</section>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - EcoBloom</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>

<body class="bg-gray-50">

<!-- Navbar -->
<nav class="bg-white/80 p-4 flex justify-between items-center shadow-md sticky top-0">
  <h1 class="text-2xl font-bold text-green-700">EcoBloom</h1>
  <ul class="hidden md:flex gap-8">
    <li><a href="index.html">Home</a></li>
    <li><a href="product.html">Products</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<section class="text-center p-6">
  <h1 class="text-3xl font-bold mb-4">Our Products</h1>

  <input type="text" placeholder="Search..."
    class="w-4/5 p-3 border rounded-lg mb-6 focus:outline-none focus:ring-2 focus:ring-green-400">

  <div class="grid grid-cols-2 md:grid-cols-4 gap-6">

    <!-- Repeat cards -->
    <div class="bg-white p-4 rounded-xl shadow hover:shadow-xl">
      <img src="./images/Bestseller_1.jpg" class="rounded mb-3">
      <h1>Rose Plant</h1>
      <p class="text-green-700 font-bold">$30</p>
    </div>

    <div class="bg-white p-4 rounded-xl shadow hover:shadow-xl">
      <img src="./images/Bestseller_2.jpg" class="rounded mb-3">
      <h1>Palm Plant</h1>
      <p class="text-green-700 font-bold">$25</p>
    </div>

    <div class="bg-white p-4 rounded-xl shadow hover:shadow-xl">
      <img src="./images/Bestseller_3.jpg" class="rounded mb-3">
      <h1>Lotus Plant</h1>
      <p class="text-green-700 font-bold">$35</p>
    </div>

    <div class="bg-white p-4 rounded-xl shadow hover:shadow-xl">
      <img src="./images/Bestseller_4.jpg" class="rounded mb-3">
      <h1>Big Leaf Plant</h1>
      <p class="text-green-700 font-bold">$15</p>
    </div>

  </div>
</section>

<!-- Footer -->
<section class="bg-gray-900 text-white p-10 text-center">
  <h1 class="text-3xl text-green-400 font-bold">EcoBloom</h1>
  <p class="text-gray-400">Nature store 🌿</p>
</section>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - EcoBloom</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>

<body class="bg-gray-50">

<!-- Navbar -->
<nav class="bg-white/80 p-4 flex justify-between items-center shadow-md sticky top-0">
  <h1 class="text-2xl font-bold text-green-700">EcoBloom</h1>
  <ul class="hidden md:flex gap-8">
    <li><a href="index.html">Home</a></li>
    <li><a href="product.html">Products</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<!-- Contact -->
<div class="grid md:grid-cols-2 gap-10 p-6 max-w-5xl mx-auto">

  <div>
    <h2 class="text-3xl font-bold mb-4">Let's Talk</h2>
    <p class="text-gray-600">We would love to hear from you.</p>
  </div>

  <form class="bg-white p-6 rounded-xl shadow space-y-4">
    <input type="text" placeholder="Name" class="w-full p-3 border rounded">
    <input type="email" placeholder="Email" class="w-full p-3 border rounded">
    <input type="text" placeholder="Subject" class="w-full p-3 border rounded">
    <textarea rows="5" placeholder="Message" class="w-full p-3 border rounded"></textarea>

    <button class="bg-green-700 text-white w-full py-3 rounded">
      Send Message
    </button>
  </form>

</div>

<!-- Footer -->
<section class="bg-gray-900 text-white p-10 text-center">
  <h1 class="text-3xl text-green-400 font-bold">EcoBloom</h1>
  <p class="text-gray-400">Contact us anytime 🌿</p>
</section>

</body>
</html>
